<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>joet.uk</title>
<meta name="description" content="Joe Tomkins. Photography, travel and a weather rivalry.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%A4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #15171a;
  --ink-soft: #5d636b;
  --paper: #f6f7f8;
  --wash: 88%;
  --wash-s: 55%;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #eef0f2;
    --ink-soft: #9aa1a9;
    --paper: #0f1113;
    --wash: 16%;
    --wash-s: 45%;
  }
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--paper);
  overflow: hidden;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}

/* Two halves, each tinted by its own city's temperature */
.halves { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
.half {
  background: hsl(var(--h, 210) var(--wash-s) var(--wash));
  transition: background 1.4s ease;
  position: relative;
  display: flex;
  align-items: flex-end;
  padding: clamp(20px, 4vw, 56px);
}
.half.right { justify-content: flex-end; text-align: right; }

/* Soft light that follows the cursor */
.glow {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(420px circle at var(--x, 50%) var(--y, 40%), rgba(255,255,255,.35), transparent 70%);
  mix-blend-mode: soft-light;
}
@media (prefers-color-scheme: dark) { .glow { background: radial-gradient(420px circle at var(--x, 50%) var(--y, 40%), rgba(255,255,255,.12), transparent 70%); } }

/* Centre */
main {
  position: fixed; inset: 0;
  display: grid; place-content: center; justify-items: center;
  text-align: center; gap: 1.6rem;
  padding: 0 20px;
  pointer-events: none;
}
main > * { pointer-events: auto; }
h1 {
  font-weight: 200;
  font-size: clamp(4.5rem, 17vw, 13rem);
  letter-spacing: -0.05em;
  line-height: .9;
}
.sub { color: var(--ink-soft); font-size: 1rem; }
nav { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; }
nav a {
  color: var(--ink); text-decoration: none; font-weight: 500; font-size: 1rem;
  background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
  padding-bottom: 3px;
  transition: background-size .35s ease;
}
nav a:hover, nav a:focus-visible { background-size: 100% 1px; outline: none; }
nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

/* Weather readout */
.city { font-size: .95rem; color: var(--ink-soft); }
button.temp {
  all: unset; cursor: pointer; display: block;
  font-weight: 200; font-size: clamp(2.4rem, 6vw, 4.5rem);
  letter-spacing: -0.04em; line-height: 1.05; color: var(--ink);
}
button.temp:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; border-radius: 4px; }
.clock { font-size: .9rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.verdict { color: var(--ink-soft); font-size: .95rem; min-height: 1.4em; }

/* One load moment: the page eases in */
.halves, main { animation: in 1.2s ease both; }
@keyframes in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .halves, main { animation: none; }
  .half { transition: none; }
  nav a { transition: none; }
}

/* Stack on small screens */
@media (max-width: 640px) {
  .halves { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .half, .half.right { align-items: flex-end; justify-content: flex-start; text-align: left; }
  .half.right { align-items: flex-end; }
  h1 { font-size: clamp(4rem, 24vw, 7rem); }
}
</style>
</head>
<body>

<div class="halves" aria-hidden="false">
  <section class="half" id="cam" aria-label="Cambridge weather">
    <div>
      <div class="city">Cambridge</div>
      <button class="temp" data-unit-toggle aria-label="Cambridge temperature, tap to change units">--</button>
      <div class="clock" id="cam-clock"></div>
    </div>
  </section>
  <section class="half right" id="dal" aria-label="Dallas weather">
    <div>
      <div class="city">Dallas</div>
      <button class="temp" data-unit-toggle aria-label="Dallas temperature, tap to change units">--</button>
      <div class="clock" id="dal-clock"></div>
    </div>
  </section>
</div>
<div class="glow" id="glow"></div>

<main>
  <h1>hello.</h1>
  <p class="sub">have a look around</p>
  <nav>
    <a href="https://importedlens.com">blog</a>
    <a href="https://instagram.com/importedlens">instagram</a>
  </nav>
  <p class="verdict" id="verdict" aria-live="polite"></p>
</main>

<script>
(function () {
  var cities = {
    cam: { lat: 52.2053, lon: 0.1218, tz: "Europe/London", name: "Cambridge", c: null },
    dal: { lat: 32.7767, lon: -96.797, tz: "America/Chicago", name: "Dallas", c: null }
  };
  var useF = false;
  try { useF = localStorage.getItem("unit") === "F"; } catch (e) {}

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Cold is blue, mild is green-teal, hot is amber
  function hueFor(c) {
    var t = Math.max(-5, Math.min(40, c));
    return Math.round(215 - ((t + 5) / 45) * 185);
  }
  function show(c) {
    return Math.round(useF ? c * 9 / 5 + 32 : c) + "\u00B0" + (useF ? "F" : "C");
  }
  function countUp(el, target) {
    if (reduce) { el.textContent = show(target); return; }
    var start = performance.now(), dur = 1100;
    (function step(now) {
      var p = Math.min(1, (now - start) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      el.textContent = show(target * e);
      if (p < 1) requestAnimationFrame(step);
    })(start);
  }
  function verdict() {
    var a = cities.cam.c, b = cities.dal.c, el = document.getElementById("verdict");
    if (a == null || b == null) return;
    var d = Math.abs(a - b), diff = useF ? Math.round(d * 9 / 5) : Math.round(d);
    var u = "\u00B0" + (useF ? "F" : "C");
    if (Math.round(d) === 0) { el.textContent = "Dead level."; return; }
    el.textContent = (b > a ? "Dallas" : "Cambridge") + " is " + diff + u + " warmer.";
  }
  function render(key, animate) {
    var city = cities[key]; if (city.c == null) return;
    var half = document.getElementById(key);
    half.style.setProperty("--h", hueFor(city.c));
    var btn = half.querySelector(".temp");
    if (animate) countUp(btn, city.c); else btn.textContent = show(city.c);
  }
  function load(key) {
    var c = cities[key];
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + c.lat + "&longitude=" + c.lon + "&current=temperature_2m";
    fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      c.c = j.current.temperature_2m;
      render(key, true);
      verdict();
    }).catch(function () {});
  }
  function clocks() {
    ["cam", "dal"].forEach(function (k) {
      var t = new Date().toLocaleTimeString("en-GB", { timeZone: cities[k].tz, hour: "2-digit", minute: "2-digit" });
      document.getElementById(k + "-clock").textContent = t;
    });
  }

  document.querySelectorAll("[data-unit-toggle]").forEach(function (b) {
    b.addEventListener("click", function () {
      useF = !useF;
      try { localStorage.setItem("unit", useF ? "F" : "C"); } catch (e) {}
      render("cam", false); render("dal", false); verdict();
    });
  });

  var glow = document.getElementById("glow");
  window.addEventListener("pointermove", function (e) {
    glow.style.setProperty("--x", e.clientX + "px");
    glow.style.setProperty("--y", e.clientY + "px");
  });

  load("cam"); load("dal");
  clocks(); setInterval(clocks, 15000);
  setInterval(function () { load("cam"); load("dal"); }, 600000);
})();
</script>
</body>
</html>
